# ============================================================
# {{APP_NAME}} 配布サイト — Nginx 設定例 (Ubuntu 22.04)
# 配置先: /etc/nginx/sites-available/{{SITE_SLUG}}
# 有効化: sudo ln -s /etc/nginx/sites-available/{{SITE_SLUG}} /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # 公開ドメイン
    server_name {{SITE_HOST}};

    # リポジトリの web/ をそのまま配信する（git pull がデプロイになる）
    root {{SERVER_REPO_DIR}}/web;
    index index.html;

    # 文字コード
    charset utf-8;

    # アクセスログ
    access_log /var/log/nginx/{{SITE_SLUG}}.access.log;
    error_log  /var/log/nginx/{{SITE_SLUG}}.error.log;

    # ---- 通常ページ ----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- 公開しないもの ----
    # Nginx の設定例と手順書（このフォルダ）は配信しない
    # ^~ を付ける: 付けないと /deploy/*.html が下の正規表現の location（.html）に取られて配信される
    location ^~ /deploy/ {
        return 404;
    }

    # ---- HTML は毎回再検証（更新を即時反映） ----
    # サイドバーのメニューや本文を更新したとき、スーパーリロードせずに反映させる。
    # ETag/Last-Modified による条件付きリクエストなので、未変更なら 304 で帯域も最小。
    location ~* \.html?$ {
        expires off;
        add_header Cache-Control "no-cache";
        # セキュリティヘッダ（location に add_header があると server 段の add_header は継承されないため、ここにも書く）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---- インストーラーのダウンロード ----
    # .exe を「保存」させ、大きいファイルを安定して配る
    location /downloads/ {
        # ダウンロードとして扱う（ブラウザで実行させない）
        add_header Content-Disposition "attachment";
        # セキュリティヘッダ（location に add_header があると server 段の add_header は継承されないため、ここにも書く）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        types { application/octet-stream exe; }
        default_type application/octet-stream;

        # 大容量ファイル向け
        sendfile on;
        tcp_nopush on;
        max_ranges 1;          # レジューム(部分DL)を許可
    }

    # ---- 版の一覧はキャッシュさせない ----
    location = /downloads.json {
        add_header Cache-Control "no-cache, must-revalidate";
        # セキュリティヘッダ（location に add_header があると server 段の add_header は継承されないため、ここにも書く）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        types { application/json json; }
        default_type application/json;
    }

    # ---- 静的アセット ----
    location /assets/ {
        access_log off;

        # 画像・フォントなど内容が変わらないものは長期キャッシュ
        expires 7d;
        add_header Cache-Control "public";
        # セキュリティヘッダ（location に add_header があると server 段の add_header は継承されないため、ここにも書く）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # JS/CSS はメニュー定義やスタイルを含み更新頻度が高いため、
        # 長期キャッシュさせず毎回再検証させる。古いメニューが残りスーパーリロードが必要になる問題を防ぐ。
        location ~* \.(?:css|js)$ {
            expires off;
            add_header Cache-Control "no-cache";
            # セキュリティヘッダ（location に add_header があると server 段の add_header は継承されないため、ここにも書く）
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # ---- gzip ----
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # ---- セキュリティヘッダ ----
    # ⚠️ add_header を持つ location（.html・/downloads/・/downloads.json・/assets/）は、ここを継承しない（Nginx の仕様）。
    #    そのため各 location にも同じ 3 行を書いてある。ヘッダを変えるときは全部の箇所を直す。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 大きいインストーラーのアップロード/配信に備える（必要に応じて調整）
    client_max_body_size 512m;
}

# ============================================================
# HTTPS を使う場合（Let's Encrypt / certbot 推奨）:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d {{SITE_HOST}}
#
# certbot が上記 server ブロックに 443 / 証明書設定を自動追記し、
# 80 番は 443 へリダイレクトされます。
# ============================================================
